<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Approved – Klaro</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12);">
          <tr>
            <td style="background:#1a56db;padding:32px 40px;">
              <h1 style="margin:0;color:#ffffff;font-size:22px;font-weight:700;">Klaro</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:40px 40px 24px;">
              <h2 style="margin:0 0 16px;font-size:20px;color:#111827;">Your upload was approved ✅</h2>
              <p style="margin:0 0 16px;font-size:15px;color:#6b7280;line-height:1.6;">
                Hi {{.FullName}}, your upload <strong>{{.ResourceName}}</strong> has been reviewed and approved.
              </p>
              {{if gt .Points 0}}
              <p style="margin:0 0 24px;font-size:15px;color:#6b7280;line-height:1.6;">
                You've been awarded <strong style="color:#1a56db;">+{{.Points}} points</strong> for your contribution. Keep it up!
              </p>
              {{end}}
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:6px;background:#1a56db;">
                    <a href="{{.AppURL}}" style="display:inline-block;padding:12px 28px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">
                      View on Klaro →
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px;border-top:1px solid #f3f4f6;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">© {{.Year}} Klaro. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
